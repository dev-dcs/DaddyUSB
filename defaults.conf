# USB Manager settings. The WebUI writes this file, hand edits are fine too.
enabled=1
prompt=1
default_mode=charging
default_adb=0
adb_off_unplug=1
defer_locked=1
dnd=0
dnd_action=charging
notify=1
ui_host=auto
block=0
guard=0
guard_timeout=60
guard_sticky=1
guard_cutoff=1
guard_warn=1
guard_action=reboot
